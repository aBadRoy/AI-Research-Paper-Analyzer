{% extends "base.html" %}
{% block title %}Processing... — AI Paper Analyzer{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3 text-center py-5">
            <div class="card-body px-4">
                <div class="mb-4">
                    <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <h4 class="fw-bold mb-3">Analyzing Your Paper</h4>
                <p class="text-muted mb-4" id="stepText">Starting analysis...</p>
                <div class="progress mb-3" style="height: 14px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                         role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    </div>
                </div>
                <p class="text-muted small" id="progressText">0%</p>
                <div id="errorBox" class="alert alert-danger d-none mt-3" role="alert"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const FILE_ID = {{ file_id }};

function pollProgress() {
    fetch(`/api/progress/${FILE_ID}`)
        .then(r => r.json())
        .then(data => {
            const pct = Math.round(data.progress || 0);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressBar').setAttribute('aria-valuenow', pct);
            document.getElementById('progressText').textContent = pct + '%';
            if (data.step) {
                document.getElementById('stepText').textContent = data.step;
            }
            if (data.status === 'done') {
                document.getElementById('progressBar').classList.remove('progress-bar-animated');
                document.getElementById('progressBar').classList.add('bg-success');
                document.getElementById('stepText').textContent = 'Analysis complete! Redirecting...';
                setTimeout(() => { window.location.href = `/result/${data.result_id}`; }, 800);
            } else if (data.status === 'error') {
                document.getElementById('progressBar').classList.remove('progress-bar-animated');
                document.getElementById('progressBar').classList.add('bg-danger');
                document.getElementById('stepText').textContent = 'Analysis failed';
                document.getElementById('stepText').className = 'text-danger mb-4';
                document.getElementById('errorBox').textContent = data.error || 'An unknown error occurred.';
                document.getElementById('errorBox').classList.remove('d-none');
            } else {
                setTimeout(pollProgress, 600);
            }
        })
        .catch(() => { setTimeout(pollProgress, 1500); });
}

setTimeout(pollProgress, 800);
</script>
{% endblock %}
